name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [terminé]
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend with Frontend Assets
        run: |
          # Build frontend
          cd frontend/
          pnpm install --no-frozen-lockfile
          echo "Building with pages mode"
          pnpm build:pages
          cd ..

          cd worker/
          echo "Using committed wrangler.toml:"
          cat wrangler.toml

          pnpm install --no-frozen-lockfile
          pnpm run deploy
          echo "Deploy completed"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
